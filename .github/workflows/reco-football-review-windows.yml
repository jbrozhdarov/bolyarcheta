name: Reco Football Review Windows Build

on:
  push:
    branches:
      - codex-reco-windows-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out build inputs
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: build-input

      - name: Check out Reco v0.5.4 source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: reco-project/video-stitcher
          ref: cd3bf434b92c678a5585cd9be2330eda49782a8a
          path: reco

      - name: Apply Football Review patch
        shell: pwsh
        run: |
          Set-Location reco
          git am "..\build-input\reco-football-review.patch"
          git status --short

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: reco
          key: reco-football-review-windows-v1

      - name: Install shared FFmpeg 7.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'reco-football-review-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=15"
          $asset = $null
          foreach ($release in $releases) {
            $asset = $release.assets | Where-Object { $_.name -like "*n7.1*win64-gpl-shared*.zip" } | Select-Object -First 1
            if ($asset) { break }
          }
          if (-not $asset) { throw "No FFmpeg n7.1 win64-gpl-shared archive found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DLL_DIR=$dir\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFmpeg asset: $($asset.name)"

      - name: Build optimized DirectML GUI
        shell: pwsh
        working-directory: reco
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p reco-gui --features load-dynamic

      - name: Download ONNX Runtime, DirectML, and model
        shell: pwsh
        run: |
          $ortPackage = "$env:RUNNER_TEMP\ort-dml.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg" -OutFile $ortPackage
          Expand-Archive -Path $ortPackage -DestinationPath "$env:RUNNER_TEMP\ort-dml"
          "ORT_DLL=$env:RUNNER_TEMP\ort-dml\runtimes\win-x64\native\onnxruntime.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $directMlPackage = "$env:RUNNER_TEMP\directml.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $directMlPackage
          Expand-Archive -Path $directMlPackage -DestinationPath "$env:RUNNER_TEMP\directml"
          "DML_DLL=$env:RUNNER_TEMP\directml\bin\x64-win\DirectML.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Invoke-WebRequest -Uri "https://github.com/reco-project/video-stitcher/releases/download/v0.5.4/yolo26n.onnx" -OutFile "$env:RUNNER_TEMP\yolo26n.onnx"

      - name: Package portable Windows application
        shell: pwsh
        run: |
          $staging = "reco-football-review-v0.5.4-review1-windows-x86_64"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "reco\target\x86_64-pc-windows-msvc\release\reco-gui.exe" "$staging\"
          Copy-Item "reco\LICENSE" "$staging\"
          Copy-Item "reco\docs\FOOTBALL_REVIEW_BG.md" "$staging\README_FIRST_BG.md"
          Copy-Item "$env:FFMPEG_DLL_DIR\*.dll" "$staging\"
          Copy-Item "$env:FFMPEG_DLL_DIR\ffmpeg.exe" "$staging\"
          Copy-Item "$env:ORT_DLL" "$staging\onnxruntime.dll"
          Copy-Item "$env:DML_DLL" "$staging\DirectML.dll"
          Copy-Item "$env:RUNNER_TEMP\yolo26n.onnx" "$staging\yolo26n.onnx"

          $manifest = @"
          Reco Football Review 0.5.4-football-review.1
          Base source: reco-project/video-stitcher cd3bf434b92c678a5585cd9be2330eda49782a8a
          Patch commit: ee75792
          Target: x86_64-pc-windows-msvc
          AI runtime: ONNX Runtime 1.24.4 + DirectML 1.15.4
          Bundled model: official Reco v0.5.4 yolo26n.onnx
          "@
          $manifest | Set-Content "$staging\BUILD_INFO.txt" -Encoding utf8

          Get-ChildItem $staging -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$staging\SHA256SUMS.txt" -Encoding ascii

          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -CompressionLevel Optimal

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reco-football-review-windows-x86_64
          path: reco-football-review-v0.5.4-review1-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
